name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. 配置 Android SDK 权限与缓存
        uses: subosito/flutter-action@v2
        ignore-only: true
        continue-on-error: true

      - name: 4. 配置 Gradle 构建工具
        run: |
          chmod +x gradlew

      - name: 5. 全自动下载所有 AI 依赖模型 (HuggingFace 官方直连)
        run: |
          # 创建模型资源存放目录
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models

          echo "===== 开始下载 语音识别模型 (SenseVoice) ====="
          # 改用 huggingface.co 官方直连，海外服务器速度极快且不会超时
          wget -c -t 5 -T 30 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx
          wget -c -t 5 -T 30 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt

          echo "===== 检查模型文件大小 ====="
          ls -lh

      - name: 6. 执行打包命令
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 7. 上传打包好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
