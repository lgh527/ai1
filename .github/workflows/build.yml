name: 灵序织影 - 全自动云端打包工具

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. 拉取你的仓库代码（包含你上传的 MyApp.zip）
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    # 2. 【核心】全自动智能解压 ZIP，并修复目录嵌套问题
    - name: 2. 全自动智能解压
      run: |
        echo "开始解压源码压缩包..."
        mkdir -p temp_unzip
        unzip -o MyApp.zip -d temp_unzip
        # 智能检测压缩包内是否有多层文件夹，防止找不到 settings.gradle
        if [ -d "temp_unzip/$(ls temp_unzip | head -n 1)/app" ]; then
          cp -r temp_unzip/*/* .
        else
          cp -r temp_unzip/* .
        fi
        rm -rf temp_unzip MyApp.zip
        echo "解压完成，当前目录结构："
        ls -F

    # 3. 配置 Java 17 环境
    - name: 3. 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. 配置 Gradle
    - name: 4. 配置 Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2.1

    # 5. 【核心】全自动下载所有 AI 模型大文件
    - name: 5. 全自动下载 AI 模型
      run: |
        echo "正在创建模型目录..."
        mkdir -p app/src/main/assets/models
        
        echo "1/3 正在下载 ONNX 语音识别模型..."
        wget -c -q --tries=5 --timeout=30 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx -O app/src/main/assets/models/model.int8.onnx || echo "ONNX 下载失败"
        
        echo "2/3 正在下载分词字典..."
        wget -c -q --tries=5 --timeout=30 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt -O app/src/main/assets/models/tokens.txt || echo "字典 下载失败"
        
        echo "3/3 正在下载 MiniLM 语义向量模型..."
        wget -c -q --tries=5 --timeout=30 https://huggingface.co/Arm/minilm-l6-v2-int8-litert/resolve/main/minilm-l6-v2_litert_optimized.tflite -O app/src/main/assets/models/minilm.tflite || echo "TFLite 下载失败"

    # 6. 【核心】全自动执行 R8 混淆打包
    - name: 6. 执行打包命令
      run: |
        echo "开始执行 Gradle 打包..."
        gradle assembleDebug

    # 7. 提取并上传 APK
    - name: 7. 上传打包好的 APK
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
