name: 灵序织影 - 云端打包

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: 解压
      run: |
        mkdir -p temp_unzip
        unzip -o MyApp.zip -d temp_unzip
        if [ -d "temp_unzip/$(ls temp_unzip | head -n 1)/app" ]; then cp -r temp_unzip/*/* .; else cp -r temp_unzip/* .; fi
        rm -rf temp_unzip MyApp.zip
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: gradle/gradle-build-action@v3
      with: { gradle-version: 8.2.1 }
    - name: 下载模型
      run: |
        mkdir -p app/src/main/assets/models && cd app/src/main/assets/models
        sudo apt-get update -qq && sudo apt-get install -y aria2
        aria2c -x 4 -s 4 -o model.int8.onnx "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx"
        aria2c -x 4 -s 4 -o tokens.txt "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt"
        aria2c -x 4 -s 4 -o UVR_MDXNET_9482.onnx "https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/UVR_MDXNET_9482.onnx"
    - name: 打包
      run: gradle assembleDebug
    - uses: actions/upload-artifact@v4
      with: { name: LingXu-App-APK, path: app/build/outputs/apk/debug/app-debug.apk }
