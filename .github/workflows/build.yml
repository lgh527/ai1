name: Build Qwen3B Offline APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Overlay Gradle config
        run: |
          cp android-overlay/app/build.gradle android/app/build.gradle
          cp android-overlay/build.gradle android/build.gradle
          cp android-overlay/settings.gradle android/settings.gradle

      - name: 下载 Qwen2.5 3B Q4_K_M 模型
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          MODEL_URL="https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"
          MODEL_PATH="android/app/src/main/jniLibs/arm64-v8a/libmodel-qwen25-3b-q4km.so"

          for i in 1 2 3; do
            echo "下载尝试第 $i 次…"
            wget -c --tries=3 --timeout=600 --waitretry=10 \
              "$MODEL_URL" -O "$MODEL_PATH" && break
            echo "第 $i 次失败，等待 20 秒后重试…"
            sleep 20
          done

          if [ ! -f "$MODEL_PATH" ]; then
            echo "ERROR: 模型文件未下载成功"
            exit 1
          fi
          SIZE=$(stat -c%s "$MODEL_PATH")
          echo "模型文件大小：$SIZE 字节"
          if [ "$SIZE" -lt 1500000000 ]; then
            echo "ERROR: 模型文件大小异常（小于 1.5 GB），可能下载不完整"
            exit 1
          fi
          echo "模型文件校验通过"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suanming-qwen3b-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
