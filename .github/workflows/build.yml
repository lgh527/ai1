name: Build LingXu V160

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Code (拉取代码)
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17 (配置JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Unzip Source Code (解压源码)
      run: |
        mkdir -p temp_unzip
        # 智能匹配最新版本的 ZIP 包
        unzip -o LingXuZhiYing_V160_StrictTrue.zip -d temp_unzip || unzip -o *.zip -d temp_unzip
        rm -rf temp_unzip/.github
        
        if [ -d "temp_unzip/app" ]; then
          cp -r temp_unzip/. .
        else
          FIRST_DIR=$(ls -A temp_unzip | head -n 1)
          if [ -d "temp_unzip/$FIRST_DIR/app" ]; then
            cp -r temp_unzip/$FIRST_DIR/. .
          else
            cp -r temp_unzip/. .
          fi
        fi
        rm -rf temp_unzip *.zip
        echo "✅ 源码解压完成"

    - name: 4. Setup Gradle Native (原生安装Gradle 8.2.2)
      run: |
        echo "正在下载 Gradle 8.2.2..."
        wget -q https://services.gradle.org/distributions/gradle-8.2.2-bin.zip -O gradle.zip
        unzip -q gradle.zip
        echo "${PWD}/gradle-8.2.2/bin" >> $GITHUB_PATH
        export PATH=$PATH:$PWD/gradle-8.2.2/bin
        gradle -v

    - name: 5. Generate Signature & Inject (自动签名并注入防破解)
      run: |
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"
        
        echo "===== 提取签名指纹并注入源码 ====="
        SIGNATURE_HEX=$(keytool -list -v -keystore release.jks -alias release -storepass 123456 | grep "SHA256:" | sed 's/.*SHA256: //' | sed 's/://g' | tr '[:lower:]' '[:upper:]')
        
        # 查找 MainActivity.kt 并替换占位符
        find app/src/main/java -name "MainActivity.kt" -exec sed -i "s/YOUR_APP_SIGNATURE_PLACEHOLDER/$SIGNATURE_HEX/g" {} +
        echo "✅ 签名注入完成，防破解封印已生效！"

    - name: 6. Download AI Models (下载AI模型)
      run: |
        mkdir -p app/src/main/assets/models
        cd app/src/main/assets/models

        echo "===== 下载 语音识别模型 (ASR) ====="
        wget -q --tries=10 --timeout=120 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx" -O model.int8.onnx

        echo "===== 下载 字典 ====="
        wget -q --tries=10 --timeout=120 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt" -O tokens.txt

        cd ../../../../..
        
        echo "===== 从 Release 下载大模型并解压 (LLM) ====="
        wget -q --tries=5 --timeout=300 "https://github.com/lgh527/ai1/releases/download/v1.0/gemma-tflite-gemma-2b-it-gpu-int4-v1.tar.gz" -O gemma_model.tar.gz
        
        tar -xzf gemma_model.tar.gz
        find . -name "*.bin" -exec mv {} app/src/main/assets/models/ \;
        rm -rf gemma_model.tar.gz
        echo "✅ 大模型解压并安置完毕"

    - name: 7. Check Models (检查模型完整性)
      run: |
        ls -lh app/src/main/assets/models/
        if [ ! -f "app/src/main/assets/models/gemma-2b-it-gpu-int4.bin" ]; then
          echo "❌ 错误：未在 assets/models 下找到大模型文件。"
          exit 1
        fi
        echo "✅ 所有模型准备就绪"

    - name: 8. Build APK (执行正式打包)
      run: |
        echo "开始清理旧缓存..."
        gradle clean
        echo "开始执行 Release 正式版打包..."
        gradle assembleRelease

    - name: 9. Upload Artifact (上传APK产物)
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-V160-True-Alignment-APK
        path: app/build/outputs/apk/release/app-release.apk
