name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出源码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 安装官方指定的 Gradle 8.5 版本，完美适配 Android 编译
    - name: 3. 安装兼容的 Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 4. 全自动下载 AI 模型
      run: |
        echo "正在创建模型存放目录..."
        mkdir -p app/src/main/assets/models
        
        echo "正在下载 model.int8.onnx 模型文件..."
        wget -c -q --tries=5 --timeout=120 -O app/src/main/assets/models/model.int8.onnx "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx"
        
        echo "正在下载 tokens.txt 字典文件..."
        wget -c -q --tries=5 --timeout=60 -O app/src/main/assets/models/tokens.txt "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt"
        
        echo "模型文件下载检查："
        ls -lh app/src/main/assets/models/

    - name: 5. 使用 Gradle 编译打包 APK (Release)
      run: gradle assembleRelease --no-daemon

    - name: 6. 上传生成的 APK 产物
      uses: actions/upload-artifact@v4
      with:
        name: LingXuZhiYing-Release-APK
        path: app/build/outputs/apk/release/app-release.unaligned.apk
