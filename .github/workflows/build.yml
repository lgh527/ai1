name: Build Android APK from ZIP

on: 
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击按钮重试

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    # 1. 自动解压上传的压缩包
    - name: Unzip Source Code
      run: |
        if [ ! -f "MyApp.zip" ]; then
          echo "Error: 没找到 MyApp.zip 压缩包，请确保已上传到根目录且名称正确！"
          exit 1
        fi
        unzip -o MyApp.zip -d .
        rm MyApp.zip # 解压后删除原包
        echo "解压完成，当前根目录如下："
        ls -la

    # 2. 配置 Java 17 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'temurin'
    
    # 3. 缓存 Gradle 依赖（加速第二次打包）
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2.1
        
    # 4. 下载 AI 语音模型（带重试和校验）
    - name: Download AI Models
      run: |
        mkdir -p app/src/main/assets/models
        echo "开始下载 ONNX 语音模型..."
        wget -c -q --tries=10 --timeout=60 --waitretry=5 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx -O app/src/main/assets/models/model.int8.onnx
        
        echo "开始下载 Tokens..."
        wget -c -q --tries=10 --timeout=60 --waitretry=5 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt -O app/src/main/assets/models/tokens.txt
        
        # 校验模型大小是否正常
        SIZE=$(stat -c%s app/src/main/assets/models/model.int8.onnx)
        if [ "$SIZE" -lt 10000000 ]; then
          echo "Error: 模型下载失败或文件损坏！大小仅为 $SIZE 字节。请点击右上角 Re-run jobs 重试。"
          exit 1
        fi
        echo "模型下载并校验成功！"

    # 5. 编译打包
    - name: Build APK
      run: gradle assembleDebug --no-daemon
      
    # 6. 将生成的 APK 上传
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: LingXu-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
