name: 灵序织影 V96 - 云端全自动打包

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 全自动智能解压
      run: |
        mkdir -p temp_unzip
        unzip -o LingXuZhiYing_V96.zip -d temp_unzip
        rm -rf temp_unzip/.github
        
        if [ -d "temp_unzip/app" ]; then
          cp -r temp_unzip/. .
        else
          FIRST_DIR=$(ls -A temp_unzip | head -n 1)
          if [ -d "temp_unzip/$FIRST_DIR/app" ]; then
            cp -r temp_unzip/$FIRST_DIR/. .
          else
            cp -r temp_unzip/. .
          fi
        fi
        
        rm -rf temp_unzip LingXuZhiYing_V96.zip
        echo "✅ 解压完成，当前目录："
        ls -AF

    - name: 3. 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. 配置 Gradle 构建工具
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2.1

    - name: 5. 全自动下载所有 AI 依赖模型
      run: |
        mkdir -p app/src/main/assets/models
        cd app/src/main/assets/models

        echo "===== 安装 aria2 ====="
        sudo apt-get update -qq && sudo apt-get install -y aria2

        echo "===== 下载 语音识别模型 ====="
        aria2c -x 4 -s 4 --max-tries=5 --retry-wait=3 --timeout=30 --allow-overwrite=true -o model.int8.onnx "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx" || \
        wget -c -q --tries=5 --timeout=60 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx" -O model.int8.onnx

        echo "===== 下载 字典 ====="
        aria2c -x 4 -s 4 --max-tries=5 --retry-wait=3 --timeout=30 --allow-overwrite=true -o tokens.txt "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt" || \
        wget -c -q --tries=5 --timeout=60 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt" -O tokens.txt

        echo "===== 下载 语义对齐模型 ====="
        aria2c -x 4 -s 4 --max-tries=5 --retry-wait=3 --timeout=30 --allow-overwrite=true -o minilm.tflite "https://hf-mirror.com/Arm/minilm-l6-v2-int8-litert/resolve/main/minilm-l6-v2_litert_optimized.tflite" || \
        wget -c -q --tries=5 --timeout=60 "https://hf-mirror.com/Arm/minilm-l6-v2-int8-litert/resolve/main/minilm-l6-v2_litert_optimized.tflite" -O minilm.tflite

        echo "===== 检查依赖完整性 ====="
        if [ ! -f model.int8.onnx ] || [ $(stat -c%s model.int8.onnx) -lt 100000000 ]; then exit 1; fi
        if [ ! -f tokens.txt ] || [ $(stat -c%s tokens.txt) -lt 10000 ]; then exit 1; fi
        if [ ! -f minilm.tflite ] || [ $(stat -c%s minilm.tflite) -lt 10000000 ]; then exit 1; fi
        echo "✅ 依赖完整"

    - name: 6. 执行打包命令
      run: gradle assembleDebug

    - name: 7. 上传打包好的 APK
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-App-APK-V96
        path: app/build/outputs/apk/debug/app-debug.apk
