name: Build Android Native APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2.1

    # 核心脚本：自动下载模型
    - name: Prepare Assets & Models
      run: |
        mkdir -p app/src/main/assets/models
        wget -c -q --tries=5 --timeout=30 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx -O app/src/main/assets/models/model.int8.onnx || echo "ONNX download failed"
        wget -c -q --tries=5 --timeout=30 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt -O app/src/main/assets/models/tokens.txt || echo "Tokens download failed"
        wget -c -q --tries=5 --timeout=30 https://huggingface.co/Arm/minilm-l6-v2-int8-litert/resolve/main/minilm-l6-v2_litert_optimized.tflite -O app/src/main/assets/models/minilm.tflite || echo "TFLite download failed"

    # 核心脚本：执行打包
    - name: Build APK
      run: gradle assembleDebug

    # 核心脚本：上传打包好的 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with: 
        name: LingXu-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
