name: Build LingXu V172

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Code (拉取代码)
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17 (配置JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Unzip Source Code (解压源码)
      run: |
        mkdir -p temp_unzip
        # 智能寻找 ZIP 包
        unzip -o *.zip -d temp_unzip || true
        rm -rf temp_unzip/.github || true

        if [ -d "temp_unzip/app" ]; then
          cp -r temp_unzip/. . || true
        else
          FIRST_DIR=$(ls -A temp_unzip | head -n 1 || true)
          if [ -d "temp_unzip/$FIRST_DIR/app" ]; then
            cp -r temp_unzip/$FIRST_DIR/. . || true
          else
            cp -r temp_unzip/. . || true
          fi
        fi
        rm -rf temp_unzip *.zip || true
        echo "✅ 源码解压完成"

    - name: 4. Setup Gradle Native (使用腾讯镜像下载Gradle 8.2.1)
      run: |
        echo "正在从腾讯云镜像下载 Gradle 8.2.1..."
        wget -q --tries=5 --timeout=120 "https://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip" -O gradle.zip
        unzip -q gradle.zip
        echo "${PWD}/gradle-8.2.1/bin" >> $GITHUB_PATH
        export PATH=$PATH:$PWD/gradle-8.2.1/bin
        gradle -v

    - name: 4.5 Cache Gradle (缓存Gradle加速构建)
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: 5. Generate Signature & Inject (自动签名并注入防破解)
      run: |
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"

        echo "===== 提取签名指纹并注入源码 ====="
        SIGNATURE_HEX=$(keytool -list -v -keystore release.jks -alias release -storepass 123456 | grep "SHA256:" | sed 's/.*SHA256: //' | sed 's/://g' | tr '[:lower:]' '[:upper:]')
        echo "提取到的签名指纹: $SIGNATURE_HEX"

        find app/src/main/java -name "MainActivity.kt" -exec sed -i "s/YOUR_APP_SIGNATURE_PLACEHOLDER/$SIGNATURE_HEX/g" {} +
        echo "✅ 签名注入完成，防破解封印已生效！"

    - name: 6. Download AI Models (下载AI模型 - 容错处理)
      run: |
        mkdir -p app/src/main/assets/models
        cd app/src/main/assets/models

        echo "===== 下载 语音识别模型 (ASR) ====="
        wget -q --tries=3 --timeout=60 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx" -O model.int8.onnx || true

        echo "===== 下载 字典 ====="
        wget -q --tries=3 --timeout=60 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt" -O tokens.txt || true

        cd ../../../../..

        echo "===== 从 Release 下载大模型并解压 (LLM) ====="
        wget -q --tries=3 --timeout=600 "https://github.com/lgh527/ai1/releases/download/v1.0/gemma-tflite-gemma-2b-it-gpu-int4-v1.tar.gz" -O gemma_model.tar.gz || true

        mkdir -p /tmp/gemma_extract
        tar -xzf gemma_model.tar.gz -C /tmp/gemma_extract || true
        find /tmp/gemma_extract -name "*.bin" -exec cp {} app/src/main/assets/models/ \; || true
        rm -rf gemma_model.tar.gz /tmp/gemma_extract
        echo "✅ 大模型下载/解压尝试完毕"

    - name: 7. Check Models (检查模型完整性 + 重命名保障)
      run: |
        echo "===== 当前模型目录内容 ====="
        ls -lh app/src/main/assets/models/ || true

        echo "===== 校验必要模型是否存在 ====="
        MISSING=0
        for f in model.int8.onnx tokens.txt; do
          if [ ! -f "app/src/main/assets/models/$f" ]; then
            echo "❌ 缺失必要模型: $f"
            MISSING=1
          fi
        done
        if [ $MISSING -eq 1 ]; then
          echo "⚠️ 警告：ASR 模型缺失，APP 语音功能将不可用，但编译会继续"
        fi

        echo "===== 确保大模型文件名与源码一致 ====="
        if [ ! -f app/src/main/assets/models/gemma-2b-it-gpu-int4.bin ]; then
          FOUND=$(find app/src/main/assets/models -maxdepth 1 -name "*.bin" | head -n 1)
          if [ -n "$FOUND" ]; then
            mv "$FOUND" app/src/main/assets/models/gemma-2b-it-gpu-int4.bin
            echo "⚠️ 已将 $FOUND 重命名为 gemma-2b-it-gpu-int4.bin"
          else
            echo "❌ 未找到任何 .bin 大模型，LLM 功能将降级（APP 仍可编译运行）"
          fi
        else
          echo "✅ 大模型文件名正确: gemma-2b-it-gpu-int4.bin"
        fi

        echo "===== 最终模型目录 ====="
        ls -lh app/src/main/assets/models/ || true
        echo "✅ 准备开始编译"

    - name: 8. Build APK (执行正式打包)
      run: |
        gradle clean assembleRelease --no-daemon

    - name: 9. Verify APK (校验APK产物)
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ -f "$APK_PATH" ]; then
          echo "✅ APK 构建成功"
          ls -lh "$APK_PATH"
          # 校验签名
          echo "===== 校验 APK 签名 ====="
          $(find $ANDROID_HOME -name apksigner | head -n 1) verify --print-certs "$APK_PATH" || true
        else
          echo "❌ APK 构建失败，未找到产物文件"
          exit 1
        fi

    - name: 10. Upload Artifact (上传APK产物)
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-V172-UltimateFusion
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
