name: Build Android APK from ZIP

on: 
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Unzip Source Code
      run: |
        if [ ! -f "MyApp.zip" ]; then
          echo "Error: 没找到 MyApp.zip 压缩包"
          exit 1
        fi
        unzip -o MyApp.zip -d .
        rm MyApp.zip
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2.1
        
    - name: Download AI Models
      run: |
        mkdir -p app/src/main/assets/models
        wget -c -q --tries=10 --timeout=60 --waitretry=5 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx -O app/src/main/assets/models/model.int8.onnx
        wget -c -q --tries=10 --timeout=60 --waitretry=5 https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt -O app/src/main/assets/models/tokens.txt
        
        SIZE=$(stat -c%s app/src/main/assets/models/model.int8.onnx)
        if [ "$SIZE" -lt 10000000 ]; then
          echo "Error: 模型下载失败"
          exit 1
        fi

    - name: Build APK
      run: gradle assembleDebug --no-daemon
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: LingXu-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
