name: 灵序织影 V111 - 全自动正式签名打包

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 全自动智能解压
      run: |
        mkdir -p temp_unzip
        unzip -o LingXuZhiYing_V111_Release.zip -d temp_unzip || unzip -o *.zip -d temp_unzip
        rm -rf temp_unzip/.github
        
        if [ -d "temp_unzip/app" ]; then
          cp -r temp_unzip/. .
        else
          FIRST_DIR=$(ls -A temp_unzip | head -n 1)
          if [ -d "temp_unzip/$FIRST_DIR/app" ]; then
            cp -r temp_unzip/$FIRST_DIR/. .
          else
            cp -r temp_unzip/. .
          fi
        fi
        
        rm -rf temp_unzip LingXuZhiYing_V111_Release.zip
        echo "✅ 解压完成，当前目录："
        ls -AF

    - name: 3. 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. 配置 Gradle 构建工具
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2.1

    - name: 5. 自动生成专属签名文件
      run: |
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"

    - name: 6. 全自动下载所有 V111 AI 依赖模型
      run: |
        mkdir -p app/src/main/assets/models && cd app/src/main/assets/models
        sudo apt-get update -qq && sudo apt-get install -y aria2

        echo "===== 下载 Paraformer 中文 ASR ====="
        mkdir -p sherpa-onnx-paraformer-zh-small
        cd sherpa-onnx-paraformer-zh-small
        wget -c -q --tries=10 --timeout=120 "https://hf-mirror.com/csukuangfj/sherpa-onnx-paraformer-zh-int8-2025-10-07/resolve/main/model.int8.onnx" -O model.int8.onnx
        wget -c -q --tries=10 --timeout=120 "https://hf-mirror.com/csukuangfj/sherpa-onnx-paraformer-zh-int8-2025-10-07/resolve/main/tokens.txt" -O tokens.txt
        cd ..

        echo "===== 下载 Omnilingual CTC-300M 强对齐 ====="
        wget -c -q --tries=10 --timeout=120 "https://hf-mirror.com/soniqo/Omnilingual-ASR-CTC-300M-LiteRT/resolve/main/omnilingual-ctc-300m.tflite" -O omnilingual-ctc-300m.tflite
        wget -c -q --tries=10 --timeout=120 "https://hf-mirror.com/soniqo/Omnilingual-ASR-CTC-300M-LiteRT/resolve/main/tokenizer.model" -O tokenizer.model

        echo "===== 下载 bge 语义对齐 ====="
        wget -c -q --tries=10 --timeout=120 "https://hf-mirror.com/Xenova/bge-small-zh-v1.5/resolve/main/onnx/model_quantized.onnx" -O bge-small-zh-v1.5.onnx
        curl -sSL --retry 5 "https://hf-mirror.com/Xenova/bge-small-zh-v1.5/resolve/main/tokenizer.json" -o tokenizer.json

        echo "===== 校验模型 ====="
        test -s sherpa-onnx-paraformer-zh-small/model.int8.onnx || exit 1
        test -s omnilingual-ctc-300m.tflite || exit 1
        test -s bge-small-zh-v1.5.onnx || exit 1

    - name: 7. 执行正式版打包命令
      run: gradle assembleRelease

    - name: 8. 上传打包好的正式版 APK
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-App-Release-Signed-V111
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
