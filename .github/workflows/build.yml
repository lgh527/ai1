name: Build LingXu V155

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Unzip Source Code
      run: |
        mkdir -p temp_unzip
        unzip -o *.zip -d temp_unzip
        rm -rf temp_unzip/.github
        if [ -d "temp_unzip/app" ]; then
          cp -r temp_unzip/. .
        else
          FIRST_DIR=$(ls -A temp_unzip | head -n 1)
          if [ -d "temp_unzip/$FIRST_DIR/app" ]; then
            cp -r temp_unzip/$FIRST_DIR/. .
          else
            cp -r temp_unzip/. .
          fi
        fi
        rm -rf temp_unzip *.zip

    - name: 4. Setup Gradle Native
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
        unzip -q gradle-8.2.1-bin.zip
        echo "$PWD/gradle-8.2.1/bin" >> $GITHUB_PATH

    - name: 5. Sign and Inject
      run: |
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"
        SIGNATURE_HEX=$(keytool -list -v -keystore release.jks -alias release -storepass 123456 | grep "SHA256:" | sed 's/.*SHA256: //' | sed 's/://g' | tr '[:lower:]' '[:upper:]')
        find app/src/main/java -name "MainActivity.kt" -exec sed -i "s/YOUR_APP_SIGNATURE_PLACEHOLDER/$SIGNATURE_HEX/g" {} +

    - name: 6. Download Models
      run: |
        mkdir -p app/src/main/assets/models
        cd app/src/main/assets/models
        wget -q "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx" -O model.int8.onnx
        wget -q "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt" -O tokens.txt
        cd ../../../../..
        wget -q "https://github.com/lgh527/ai1/releases/download/v1.0/gemma-tflite-gemma-2b-it-gpu-int4-v1.tar.gz" -O gemma.tar.gz
        tar -xzf gemma.tar.gz
        find . -name "*.bin" -exec mv {} app/src/main/assets/models/ \;
        rm -rf gemma.tar.gz

    - name: 7. Build APK
      run: |
        gradle clean
        gradle assembleRelease

    - name: 8. Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-V155-Release
        path: app/build/outputs/apk/release/app-release.apk
