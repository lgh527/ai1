name: 灵序织影 - 云端全自动打包

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 全自动智能解压
      run: |
        mkdir -p temp_unzip
        unzip -o MyApp.zip -d temp_unzip
        if [ -d "temp_unzip/$(ls temp_unzip | head -n 1)/app" ]; then
          cp -r temp_unzip/*/* .
        else
          cp -r temp_unzip/* .
        fi
        rm -rf temp_unzip MyApp.zip
        ls -F

    - name: 3. 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. 配置 Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2.1

    - name: 5. 下载 AI 模型
      run: |
        mkdir -p app/src/main/assets/models
        cd app/src/main/assets/models
        wget -c -q --tries=3 --timeout=30 https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx -O model.int8.onnx
        wget -c -q --tries=3 --timeout=30 https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt -O tokens.txt
        if [ ! -f model.int8.onnx ] || [ $(stat -c%s model.int8.onnx) -lt 100000000 ]; then exit 1; fi
        if [ ! -f tokens.txt ] || [ $(stat -c%s tokens.txt) -lt 10000 ]; then exit 1; fi

    - name: 6. 执行打包命令
      run: gradle assembleDebug

    - name: 7. 上传打包好的 APK
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
