name: Build Project  # 任务名称，可以随便改

on: 
  push:
    branches: [ "main", "master" ]  # 触发条件：推送到 main 或 master 分支时触发
  workflow_dispatch:                # 允许在网页上手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-22.04            # 运行环境，可以是 ubuntu-latest, windows-latest, macos-latest
    
    steps:
    # 1. 拉取代码 (几乎必备)
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    # 2. 环境准备 (按需写)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'temurin'

    # 3. 缓存 (可选，加速构建)
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # 4. 执行你的打包命令行 (🚨 重点：你的命令写在这里)
    - name: Run Build Commands
      run: |
        # 这里可以直接写多行命令行
        # 例如：
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    # 5. 上传产物 (打包出来的文件)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: Output-File        # 供下载的压缩包名字
        path: app/build/outputs/apk/debug/app-debug.apk  # 你的产物路径
