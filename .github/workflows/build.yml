@echo off
chcp 65001 >nul
echo =======================================
echo 开始构建灵序织影 (V100 终极全模态版)
echo =======================================

:: 1. 自动下载需要的 AI 模型
echo [1/3] 正在下载 ASR 和 NLP 模型...
if not exist "app\src\main\assets\models" mkdir "app\src\main\assets\models"
powershell -Command "Invoke-WebRequest -Uri 'https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx' -OutFile 'app\src\main\assets\models\model.int8.onnx'"
powershell -Command "Invoke-WebRequest -Uri 'https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt' -OutFile 'app\src\main\assets\models\tokens.txt'"
powershell -Command "Invoke-WebRequest -Uri 'https://huggingface.co/Arm/minilm-l6-v2-int8-litert/resolve/main/minilm-l6-v2_litert_optimized.tflite' -OutFile 'app\src\main\assets\models\minilm.tflite'"
echo 模型下载完成！

:: 2. 清理缓存
echo [2/3] 正在清理旧构建缓存...
call gradlew clean

:: 3. 执行混淆打包
echo [3/3] 正在执行 R8 混淆并编译 APK...
call gradlew assembleDebug

if %errorlevel% equ 0 (
    echo =======================================
    echo 打包成功！
    echo APK 输出路径: app\build\outputs\apk\debug\app-debug.apk
    echo =======================================
    explorer "app\build\outputs\apk\debug"
) else (
    echo [错误] 打包失败，请检查报错信息。
)
pause
