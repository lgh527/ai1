name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 自动寻找压缩包并解压
        run: |
          echo "正在检查根目录压缩包..."
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o '*.zip'
            echo "解压完成！"
          else
            echo "未发现 zip 压缩包，直接使用当前目录"
          fi
          ls -la

      - name: 3. 配置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. 自动定位项目目录并配置 Gradle
        run: |
          # 自动寻找哪个文件夹里包含 gradlew 文件，并自动进入该目录
          PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          if [ -z "$PROJECT_DIR" ]; then
            echo "错误：找不到 gradlew 文件！"
            exit 1
          fi
          echo "找到项目根目录位于: $PROJECT_DIR"
          
          # 将路径保存到环境变量，供后续步骤使用
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV
          
          cd $PROJECT_DIR
          chmod +x gradlew

      - name: 5. 全自动下载所有 AI 依赖模型 (国内镜像站+重试机制)
        run: |
          cd ${{ env.PROJECT_PATH }}
          # 创建模型资源存放目录
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models

          echo "===== 开始下载 语音识别模型 (SenseVoice) ====="
          wget -c -t 10 -T 60 https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx
          wget -c -t 10 -T 60 https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt

          echo "===== 检查模型文件大小 ====="
          ls -lh

      - name: 6. 执行打包命令
        run: |
          cd ${{ env.PROJECT_PATH }}
          ./gradlew assembleDebug --stacktrace

      - name: 7. 上传打包好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          retention-days: 7
