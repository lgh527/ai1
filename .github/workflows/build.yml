name: 灵序织影 - 终极防爆打包

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 核心防御：在环境变量层面锁死 Gradle 内存，防止编译时 OOM
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=1"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 清理并解压源码
      run: |
        mkdir -p temp_unzip
        unzip -o *.zip -d temp_unzip
        rm -rf temp_unzip/.github
        if [ -d "temp_unzip/app" ]; then
          cp -r temp_unzip/. .
        else
          FIRST_DIR=$(ls -A temp_unzip | head -n 1)
          if [ -d "temp_unzip/$FIRST_DIR/app" ]; then
            cp -r temp_unzip/$FIRST_DIR/. .
          else
            cp -r temp_unzip/. .
          fi
        fi
        rm -rf temp_unzip *.zip
        echo "✅ 源码解压完成"

    - name: 3. 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. 配置 Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2.1

    - name: 5. 自动生成签名
      run: |
        rm -f release.jks
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US" -noprompt
        SIGNATURE_HEX=$(keytool -list -v -keystore release.jks -alias release -storepass 123456 | grep "SHA256:" | sed 's/.*SHA256: //' | sed 's/://g' | tr '[:lower:]' '[:upper:]')
        find app/src/main/java -name "MainActivity.kt" -exec sed -i "s/YOUR_APP_SIGNATURE_PLACEHOLDER/$SIGNATURE_HEX/g" {} +
        # SignatureGuard.kt 里也有同一个占位符，一并注入，否则签名校验会退化成开发模式
        find app/src/main/java -name "*.kt" -exec sed -i "s/YOUR_APP_SIGNATURE_PLACEHOLDER/$SIGNATURE_HEX/g" {} +
        grep -rn "$SIGNATURE_HEX" app/src/main/java && echo "✅ 签名注入完成"

    - name: 6. 下载模型
      run: |
        mkdir -p app/src/main/assets/models app/libs

        # 6.1 听觉引擎：Sherpa-ONNX v1.13.5 官方预编译 AAR（含 Kotlin API + 各 ABI 的 .so）
        #     必须用官方 Release 的 AAR，不能用 com.github.k2-fsa:sherpa-onnx（那是 JVM 聚合模块，
        #     不产出 Android so，会导致 unresolved reference / UnsatisfiedLinkError）
        wget -c -q --tries=6 --timeout=300 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar" -O app/libs/sherpa-onnx-1.13.5.aar
        ls -lh app/libs/

        # 6.2 听觉大模型：SenseVoice 中英日韩粤 int8 + tokens
        cd app/src/main/assets/models
        wget -c -q --tries=10 --timeout=120 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx" -O model.int8.onnx
        wget -c -q --tries=10 --timeout=120 "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt" -O tokens.txt
        cd ../../../../..

        # 6.3 逻辑大模型：Gemma-2B-IT int4（你自己公开仓库里的 Release 资源）
        wget -c --tries=5 --timeout=300 "https://github.com/lgh527/ai1/releases/download/v1.0/gemma-tflite-gemma-2b-it-gpu-int4-v1.tar.gz" -O gemma_model.tar.gz
        tar -xzvf gemma_model.tar.gz
        find . -name "*.bin" -exec mv {} app/src/main/assets/models/ \;
        rm -rf gemma_model.tar.gz

        ls -lh app/src/main/assets/models/
        echo "✅ 模型下载完毕"

    - name: 7. 执行打包 (强制单线程低内存)
      run: |
        gradle --stop
        gradle clean
        # 限制内存，强制单线程，防 Native 库合并 OOM
        gradle assembleRelease -Dorg.gradle.jvmargs="-Xmx4g" --no-daemon --no-parallel --max-workers=1 --stacktrace

    - name: 8. 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: LingXu-V211-AntiOOM
        path: app/build/outputs/apk/release/app-release.apk
